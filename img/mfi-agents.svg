<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="Agentic pipeline graph: two sources feed a coordinator, which fans out to three agents that converge on a single output node">
  <defs>
    <radialGradient id="bg" cx="25%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#12203a"/>
      <stop offset="60%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#080b14"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="240" fill="url(#bg)"/>

  <!-- document hints -->
  <g stroke="#334155" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M18,58 H50 M18,68 H44 M18,78 H52"/>
    <path d="M18,154 H50 M18,164 H44 M18,174 H52"/>
  </g>

  <!-- edges -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#334155" stroke-width="2.2">
      <path d="M86,72 C140,72 165,102 200,116"/>
      <path d="M86,168 C140,168 165,138 200,124"/>
    </g>
    <g stroke="#3f4d6b" stroke-width="2.2">
      <path d="M233,110 C280,86 310,64 354,58"/>
      <path d="M234,120 H352"/>
      <path d="M233,130 C280,154 310,176 354,182"/>
    </g>
    <g stroke="#3f4d6b" stroke-width="2.2">
      <path d="M386,58 C430,64 480,92 524,112"/>
      <path d="M384,120 H522"/>
      <path d="M386,182 C430,176 480,148 524,128"/>
    </g>
  </g>

  <!-- glows -->
  <circle cx="215" cy="120" r="46" fill="url(#glowC)"/>
  <circle cx="545" cy="120" r="56" fill="url(#glowC)"/>
  <circle cx="370" cy="58" r="34" fill="url(#glowP)"/>
  <circle cx="370" cy="120" r="34" fill="url(#glowP)"/>
  <circle cx="370" cy="182" r="34" fill="url(#glowP)"/>

  <!-- source nodes -->
  <g fill="#0b1020" stroke="#64748b" stroke-width="2.6">
    <circle cx="70" cy="72" r="15"/>
    <circle cx="70" cy="168" r="15"/>
  </g>

  <!-- coordinator -->
  <circle cx="215" cy="120" r="19" fill="#0b1020" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="215" cy="120" r="6" fill="#06b6d4"/>

  <!-- agents -->
  <g fill="#0b1020" stroke="#a78bfa" stroke-width="3">
    <circle cx="370" cy="58" r="14"/>
    <circle cx="370" cy="120" r="14"/>
    <circle cx="370" cy="182" r="14"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="370" cy="58" r="4.5"/>
    <circle cx="370" cy="120" r="4.5"/>
    <circle cx="370" cy="182" r="4.5"/>
  </g>

  <!-- output -->
  <circle cx="545" cy="120" r="24" fill="#0b1020" stroke="#06b6d4" stroke-width="3.4"/>
  <g stroke="#06b6d4" stroke-width="2.6" stroke-linecap="round">
    <path d="M534,126 L541,118 L548,124 L557,111"/>
  </g>
</svg>
