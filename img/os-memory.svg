<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="Memory hierarchy from registers through cache, TLB, RAM and disk, each level larger and slower than the last">
  <defs>
    <radialGradient id="bg" cx="20%" cy="15%" r="95%">
      <stop offset="0%" stop-color="#12203a"/>
      <stop offset="60%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#080b14"/>
    </radialGradient>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c93d8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="640" height="240" fill="url(#bg)"/>

  <!-- hierarchy bars: narrow+fast at top, wide+slow at bottom -->
  <g>
    <rect x="70" y="34" width="92" height="26" rx="6" fill="#0b1020" stroke="#06b6d4" stroke-width="2.6"/>
    <rect x="70" y="72" width="150" height="26" rx="6" fill="#0b1020" stroke="#06b6d4" stroke-width="2.4" opacity="0.85"/>
    <rect x="70" y="110" width="236" height="26" rx="6" fill="#0b1020" stroke="#a78bfa" stroke-width="2.4" opacity="0.8"/>
    <rect x="70" y="148" width="382" height="26" rx="6" fill="#0b1020" stroke="#64748b" stroke-width="2.2"/>
    <rect x="70" y="186" width="530" height="26" rx="6" fill="#0b1020" stroke="#475569" stroke-width="2.2"/>
  </g>

  <!-- fill bars showing relative speed -->
  <g>
    <rect x="74" y="38" width="84" height="18" rx="4" fill="url(#fast)"/>
    <rect x="74" y="76" width="112" height="18" rx="4" fill="url(#fast)" opacity="0.75"/>
    <rect x="74" y="114" width="120" height="18" rx="4" fill="url(#mid)"/>
    <rect x="74" y="152" width="96" height="18" rx="4" fill="#334155"/>
    <rect x="74" y="190" width="60" height="18" rx="4" fill="#1e293b"/>
  </g>

  <!-- latency axis -->
  <g stroke="#334155" stroke-width="1.6" fill="none">
    <path d="M40,26 L40,220"/>
  </g>
  <g stroke="#475569" stroke-width="1.4" fill="none" stroke-dasharray="3 4">
    <path d="M40,47 H70 M40,85 H70 M40,123 H70 M40,161 H70 M40,199 H70"/>
  </g>

  <!-- address translation hint: split address box -->
  <g>
    <rect x="470" y="34" width="130" height="64" rx="8" fill="#0b1020" stroke="#1f2a44" stroke-width="2"/>
    <path d="M535,36 L535,96" stroke="#1f2a44" stroke-width="2"/>
    <rect x="478" y="52" width="48" height="10" rx="3" fill="#06b6d4" opacity="0.8"/>
    <rect x="544" y="52" width="48" height="10" rx="3" fill="#a78bfa" opacity="0.7"/>
    <rect x="478" y="70" width="34" height="10" rx="3" fill="#334155"/>
    <rect x="544" y="70" width="40" height="10" rx="3" fill="#334155"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M470,66 L452,66 L452,123 L310,123"/>
  </g>
  <circle cx="310" cy="123" r="4" fill="#a78bfa"/>
</svg>
